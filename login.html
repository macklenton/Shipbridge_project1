<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHIPBRIDGE</title>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main>
      <header class="main">
        <h1>SHIPBRIDGE LOGIN</h1>
        <h2>Customer Login</h2>
      </header>
      <section class="small-heading">
        <div>
          <p>
            <strong>Login to order your Package</strong>
          </p>
        </div>
      </section>
      <section>
        <div class="hero-login">
          <form autocomplete="on">
            <label for="Username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your Username"
              autocomplete="username"
              autocapitalize="none"
            />

            <br />

            <label for="Password">Password</label>
            <input
              type="Password"
              id="Password"
              name="Password"
              placeholder="Enter your Password"
            />
            <div class="hero-signin">
              <a href="order.html">Login</a>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
